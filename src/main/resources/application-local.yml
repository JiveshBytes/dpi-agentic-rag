spring:
  datasource:
    url: jdbc:h2:mem:mosipdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    database: h2
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

mosip:
  ingestion:
    jobs:
      enabled: false
